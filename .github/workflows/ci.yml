name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret scan (no committed credentials)
        run: bash scripts/check_no_secrets.sh

      - name: Compile all sources
        run: python -m compileall -q backend migrations

      - name: Run test suite
        env:
          APP_ENV: testing
          AUTH_MODE: optional
          RATE_LIMIT_ENABLED: "false"
          DATABASE_URL: sqlite:///:memory:
        run: python -m pytest -q

  migration-consistency:
    name: Migration consistency (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: razorgrowth
          POSTGRES_USER: razorgrowth
          POSTGRES_PASSWORD: razorgrowth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U razorgrowth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://razorgrowth:razorgrowth@localhost:5432/razorgrowth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply all migrations from scratch
        run: alembic upgrade head

      - name: Verify single head and applied revision
        run: |
          alembic heads
          alembic current

      - name: Detect model/migration drift
        run: |
          # Fails when ORM models diverge from migrations. Pre-existing,
          # documented baseline noise is filtered out.
          set +e
          OUTPUT=$(alembic check 2>&1)
          CODE=$?
          echo "$OUTPUT"
          FILTERED=$(echo "$OUTPUT" | grep -vE \
            'ix_knowledge_chunks_embedding|audit_events.*created_at.*DefaultClause|New upgrade operations detected|^FAILED')
          if [ $CODE -ne 0 ] && [ -n "$FILTERED" ]; then
            echo "::error::New model/migration drift introduced."
            exit 1
          fi
          echo "No new drift beyond documented baseline."

  backend-startup:
    name: Backend import & startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import app and validate routes
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///:memory:
        run: |
          python - <<'PY'
          from backend.app.main import app

          paths = sorted({getattr(r, "path", "") for r in app.routes})
          expected = [
              "/api/health",
              "/api/opportunities",
              "/api/merchants",
              "/api/products",
              "/api/customers",
              "/api/orders",
              "/api/payments",
              "/api/ai/analyze",
              "/api/ai/ingest",
              "/api/actions/{action_id}",
              "/api/actions/{action_id}/approve",
              "/api/actions/{action_id}/reject",
              "/api/actions/{action_id}/execute",
              "/api/actions/{action_id}/audit",
              "/api/agents",
              "/api/agents/run",
              "/api/agents/runs",
              "/api/radar",
              "/api/opportunities/ranked",
              "/api/customer-insights",
              "/api/customers/{customer_id}/insights",
              "/api/simulations",
              "/api/experiments",
              "/api/growth-memory",
              "/api/growth-brief",
              "/api/auth/login",
              "/api/auth/register",
              "/api/auth/me",
              "/api/webhooks/razorpay",
          ]
          missing = [p for p in expected if p not in paths]
          assert not missing, f"Missing routes: {missing}"
          dupes = [p for p in paths if p.startswith("/api/api/")]
          assert not dupes, f"Double-prefixed /api/api routes: {dupes}"
          print(f"OK: {len(paths)} routes registered; all Phase 3/4/5/6 routes present.")
          PY

      - name: Boot server against SQLite and hit health/docs
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///./ci_smoke.db
        run: |
          uvicorn backend.app.main:app --port 8001 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/api/health | grep -q healthy
          curl -sf http://127.0.0.1:8001/openapi.json >/dev/null
          curl -sf http://127.0.0.1:8001/docs >/dev/null
          curl -sf http://127.0.0.1:8001/ | grep -q RazorGrowth
          kill $SERVER_PID

  frontend-build:
    name: Frontend validation & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check & build
        working-directory: frontend
        run: npm run build

      - name: No hardcoded local-only API base in production bundle
        run: |
          # The dashboard must not embed machine-specific URLs in builds.
          if grep -R "127.0.0.1:8000" frontend/dist >/dev/null 2>&1; then
            echo "::warning::Bundle references hardcoded localhost URL (known limitation)."
          fi
