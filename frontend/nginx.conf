# RazorGrowth AI — frontend runtime configuration
#
# Serves the built SPA and proxies /api to the backend Compose service so
# the browser stays same-origin (no CORS configuration required).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA history fallback (react-router) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API reverse proxy ----
    # `backend` resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Long-cache immutable hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
