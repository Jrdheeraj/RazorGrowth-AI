services:
  db:
    # pgvector/pgvector:pg16 is PostgreSQL 16 with the pgvector extension
    # pre-installed. Drop-in replacement for postgres:16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: razorgrowth
      POSTGRES_USER: razorgrowth
      POSTGRES_PASSWORD: razorgrowth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorgrowth -d razorgrowth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
